<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>给不安世界的好消息</title>

    <style>
      @font-face {
        font-family: "LongTengKai";
        src: url("fonts/ZiHunLongTengKaiShu(ShangYongXuShouQuan)-2.ttf")
          format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --olive-dark: #142414;
        --olive: #506b2f;
        --olive-soft: #8fa75a;
        --gold: #f2c75c;
        --warm-gold: #eaa34b;
        --cream: #fff7df;
        --white: #ffffff;
        --ink: #161812;
        --muted: rgba(255, 255, 255, 0.78);
        --script: "LongTengKai", "STXingkai", "KaiTi", cursive;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1f2518;
        color: var(--white);
        font-family:
          "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Heiti SC",
          "Source Han Sans SC", "Segoe UI", Arial, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .poster {
        position: relative;
        width: min(100%, 820px);
        aspect-ratio: 8.5 / 11;
        overflow: hidden;
        background:
          url("poster_bg.png") center / cover no-repeat,
          #1f2518;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
        isolation: isolate;
      }

      .content {
        position: relative;
        z-index: 3;
        display: flex;
        min-height: 100%;
        flex-direction: column;
        padding: 0 54px 88px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 58px;
        margin: 0 -54px 0;
        padding: 9px 54px;
        background: rgba(55, 83, 48, 0.94);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 8px 24px rgba(19, 30, 15, 0.16);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
      }

      .brand img {
        width: 36px;
        height: 36px;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
      }

      .club-text {
        min-width: 0;
        letter-spacing: 0.02em;
      }

      .club-text strong {
        display: block;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.2;
        white-space: nowrap;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      .presented {
        flex-shrink: 0;
        border: 1px solid rgba(231, 207, 129, 0.58);
        border-radius: 999px;
        padding: 8px 16px;
        background: rgba(32, 56, 30, 0.18);
        color: rgba(255, 247, 217, 0.92);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        white-space: nowrap;
        backdrop-filter: blur(14px);
      }

      .hero {
        display: grid;
        flex: 1;
        align-content: center;
        padding: 22px 0 8px;
      }

      .eyebrow {
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: fit-content;
        margin-bottom: 18px;
        border-left: 5px solid var(--gold);
        padding: 0 0 0 14px;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
      }

      .eyebrow p {
        margin: 0;
        line-height: 1.2;
      }

      .eyebrow-speaker {
        color: var(--gold);
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .eyebrow-cred {
        color: rgba(255, 255, 255, 0.96);
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        letter-spacing: -0.015em;
        line-height: 1;
        font-size: clamp(74px, 13vw, 135px);
        font-weight: 950;
        text-shadow:
          0 8px 0 rgba(26, 36, 18, 0.28),
          0 20px 55px rgba(0, 0, 0, 0.36);
      }

      .title-good {
        display: block;
        color: #fff8dc;
        white-space: nowrap;
        line-height: 1;
      }

      .title-news {
        display: block;
        margin-top: 0em;
        color: transparent;
        white-space: nowrap;
        line-height: 1;
        -webkit-text-stroke: 2px rgba(255, 255, 255, 0.88);
        text-shadow:
          0 8px 0 rgba(26, 36, 18, 0.18),
          0 18px 55px rgba(0, 0, 0, 0.32);
      }

      .script {
        display: block;
        margin-top: -0.15em;
        color: var(--gold);
        white-space: nowrap;
        font-family: var(--script);
        font-size: clamp(74px, 15vw, 142px);
        font-weight: 400;
        letter-spacing: 0.18em;
        line-height: 1;
        text-shadow:
          0 8px 0 rgba(26, 36, 18, 0.28),
          0 20px 55px rgba(0, 0, 0, 0.36);
        transform: rotate(-2deg);
      }

      .pitch {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        margin-top: 18px;
      }

      .pitch-copy {
        min-width: 0;
      }

      .hook {
        max-width: 500px;
        margin: 0;
        color: rgba(255, 255, 255, 0.95);
        font-size: 25px;
        font-weight: 750;
        line-height: 1.32;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.32);
      }

      .hook em {
        color: var(--gold);
        font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
        font-weight: 700;
      }

      .subhook {
        max-width: 460px;
        margin: 20px 0 0;
        color: rgba(255, 255, 255, 0.86);
        font-size: 15px;
        font-weight: 500;
        line-height: 1.65;
      }

      .welcome-note {
        position: absolute;
        top: 188px;
        right: 22px;
        z-index: 4;
        width: 186px;
        margin: 0;
        transform: rotate(-6deg);
        filter: drop-shadow(0 6px 16px rgba(45, 30, 6, 0.42));
      }

      .welcome-note img {
        display: block;
        width: 100%;
        height: auto;
      }

      .details {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 164px;
        align-items: start;
        gap: 56px;
        margin-top: 10px;
      }

      .when-card {
        position: relative;
        display: grid;
        gap: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 26px;
        padding: 16px 22px 18px;
        background: rgba(26, 43, 23, 0.52);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
      }

      .when-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .when-row svg {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        color: var(--gold);
      }

      .when-text {
        color: var(--white);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1.25;
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.34);
      }

      .when-time {
        color: var(--gold);
        font-size: 22px;
        font-weight: 850;
        letter-spacing: -0.01em;
        text-shadow: 0 6px 22px rgba(0, 0, 0, 0.34);
      }

      .when-place {
        font-size: 18px;
        font-weight: 650;
      }

      .free-food {
        position: absolute;
        top: calc(100% - 6px);
        left: 28px;
        width: min(340px, 78%);
        height: auto;
        pointer-events: none;
        filter: drop-shadow(0 4px 10px rgba(20, 14, 4, 0.45));
      }

      .qr-column {
        position: relative;
        display: grid;
        justify-items: center;
        width: 164px;
        margin-top: -8px;
      }

      .scan-note {
        position: absolute;
        bottom: calc(100% - 22px);
        right: calc(100% - 16px);
        width: 158px;
        transform: rotate(-8deg);
      }

      .scan-note img.scan-text {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 6px 16px rgba(45, 30, 6, 0.42));
      }

      .scan-arrow {
        position: absolute;
        top: 20px;
        left: calc(100% - 8px);
        width: 52px;
        height: 56px;
      }

      .qr-wrap {
        display: grid;
        width: 100%;
        justify-items: center;
        gap: 12px;
        border: 2px solid #ffe88a;
        border-radius: 26px;
        padding: 14px 13px;
        background: linear-gradient(
          145deg,
          rgba(137, 116, 34, 0.62),
          rgba(91, 98, 31, 0.58)
        );
        box-shadow:
          0 0 5px rgba(255, 249, 198, 0.95),
          0 0 16px rgba(255, 224, 112, 0.85),
          0 0 38px rgba(242, 199, 92, 0.55),
          0 0 68px rgba(242, 199, 92, 0.3),
          inset 0 0 8px rgba(255, 246, 184, 0.55);
        backdrop-filter: blur(4px);
      }

      .qr-card {
        display: grid;
        width: 100%;
        place-items: center;
        border-radius: 16px;
        padding: 8px;
        background: #fff9df;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
      }

      .qr-card img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      .qr-cta {
        width: 100%;
        border: 1.5px solid rgba(242, 199, 92, 0.75);
        border-radius: 13px;
        padding: 8px 4px;
        background: rgba(31, 58, 27, 0.9);
        color: var(--cream);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.02em;
        white-space: nowrap;
        text-align: center;
        text-transform: uppercase;
      }

      @media (max-width: 760px) {
        body {
          padding: 12px;
        }

        .content {
          padding: 0 32px 48px;
        }

        .topbar {
          min-height: 52px;
          margin: 0 -32px 0;
          padding: 8px 32px;
        }

        .brand {
          gap: 9px;
        }

        .brand img {
          width: 31px;
          height: 31px;
        }

        .club-text strong {
          font-size: 12px;
          white-space: normal;
        }

        .presented {
          padding: 7px 12px;
          font-size: 11px;
        }

        .details {
          grid-template-columns: 1fr;
          gap: 60px;
        }

        .qr-column {
          width: 100%;
          margin-top: 0;
        }

        .scan-note {
          position: static;
          width: min(220px, 70%);
          margin: 0 auto 8px;
          transform: none;
        }

        .scan-arrow {
          display: none;
        }

        .free-food {
          left: 12px;
          width: min(300px, 88%);
        }

        .pitch {
          grid-template-columns: 1fr;
        }

        .welcome-note {
          position: static;
          width: min(220px, 70%);
          margin: 8px auto 0;
          transform: none;
        }
      }

      @page {
        size: letter;
        margin: 0;
      }

      @media print {
        html,
        body {
          width: 8.5in;
          height: 11in;
          margin: 0;
          padding: 0;
          background: white;
        }

        body {
          display: block;
        }

        .poster {
          width: 8.5in;
          height: 11in;
          box-shadow: none;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
      }
    </style>
  </head>

  <body>
    <main class="poster" aria-label="给不安世界的好消息活动海报">
      <section class="content">
        <header class="topbar">
          <div class="brand">
            <img
              src="bigLogo.png"
              alt="Green Olive Chinese Christian Club logo"
            />
            <div class="club-text">
              <strong>麦吉尔青橄榄华人基督教社团</strong>
            </div>
          </div>

          <div class="presented">校园活动</div>
        </header>

        <section class="hero">
          <div class="eyebrow">
            <p class="eyebrow-speaker">讲员：洪武韬</p>
            <p class="eyebrow-cred">麦吉尔大学神学本科&amp;硕士在读</p>
          </div>

          <h1>
            <span class="title-good">给不安</span>
            <span class="title-news">世界的</span>
            <span class="script">好消息</span>
          </h1>

          <div class="pitch">
            <div class="pitch-copy">
              <p class="hook">
                在这个焦虑和不确定的世界，<br />
                真的还有<em>好消息</em>吗？
              </p>

              <p class="subhook">
                欢迎所有人在轻松开放的交流环境中，参加我们的“基督福音”讨论活动（并设有
                Q&amp;A 环节与晚餐）。
              </p>
            </div>

            <div class="welcome-note">
              <img src="poster_welcome.png" alt="欢迎所有人参加！" />
            </div>
          </div>
        </section>

        <section class="details" aria-label="活动信息与报名二维码">
          <div class="when-card">
            <div class="when-row">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <rect x="3" y="5" width="18" height="16" rx="3.5" />
                <path d="M8 3v4M16 3v4M3 10h18" />
                <path
                  d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01M16 17.5h.01"
                  stroke-width="2.4"
                />
              </svg>

              <span class="when-text">2026年9月12日 星期六</span>
            </div>

            <div class="when-row">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5.4l3.6 2.4" />
              </svg>

              <strong class="when-time">下午5:00 &ndash; 9:00</strong>
            </div>

            <div class="when-row">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path
                  d="M12 21.5s7-6 7-11.2a7 7 0 1 0-14 0C5 15.5 12 21.5 12 21.5Z"
                />
                <circle cx="12" cy="10" r="2.7" />
              </svg>

              <span class="when-text when-place"
                >McGill University Leacock 232</span
              >
            </div>

            <img
              class="free-food"
              src="poster_free_dinner.png"
              alt="免费晚餐！"
            />
          </div>

          <div class="qr-column">
            <div class="scan-note">
              <img
                class="scan-text"
                src="poster_scan.png"
                alt="扫码报名！"
              />
              <img class="scan-arrow" src="scan_arrow.png" alt="" />
            </div>

            <aside class="qr-wrap" aria-label="报名二维码">
              <div class="qr-card">
                <img src="evangilism_event_qr_code.png" alt="活动报名二维码" />
              </div>
              <div class="qr-cta">扫码报名</div>
            </aside>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
